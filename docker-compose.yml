services:
  mongodb:
    image: mongo:7
    container_name: yam-mongodb
    ports:
      - "27017:27017"
    volumes:
      - yam-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    container_name: yam-fondos
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017/yam
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:4200
    ports:
      - "8080:8080"

volumes:
  yam-mongo-data:
